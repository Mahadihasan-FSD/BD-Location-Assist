<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0e2a3a" />
      <stop offset="100%" stop-color="#042f2e" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Subtle Map Grid lines -->
  <g stroke="#38bdf8" stroke-opacity="0.08" stroke-width="1.5">
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="500" x2="1200" y2="500" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Concentric Radar Circles in Background -->
  <circle cx="950" cy="315" r="260" stroke="#2dd4bf" stroke-opacity="0.12" stroke-width="2" fill="none" />
  <circle cx="950" cy="315" r="180" stroke="#38bdf8" stroke-opacity="0.18" stroke-width="2" stroke-dasharray="6 6" fill="none" />
  <circle cx="950" cy="315" r="100" stroke="#38bdf8" stroke-opacity="0.25" stroke-width="2" fill="none" />

  <!-- Left Content Area -->
  <!-- Brand Badge -->
  <rect x="90" y="85" width="230" height="42" rx="21" fill="#0369a1" fill-opacity="0.3" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" />
  <circle cx="112" cy="106" r="6" fill="#34d399" />
  <text x="128" y="112" font-family="'Hind Siliguri', 'Inter', system-ui, sans-serif" font-size="16" font-weight="700" fill="#7dd3fc" letter-spacing="1">BANGLADESH • GPS</text>

  <!-- Main Headline -->
  <text x="90" y="195" font-family="'Inter', system-ui, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    BD Location Assist
  </text>
  
  <text x="90" y="255" font-family="'Hind Siliguri', 'Inter', system-ui, sans-serif" font-size="34" font-weight="700" fill="url(#accentGrad)">
    নিরাপদ সম্মতিভিত্তিক লাইভ লোকেশন ট্র্যাকিং
  </text>

  <!-- Tagline / Subtitle -->
  <text x="90" y="320" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
    Consent-driven live GPS sharing for family, travels &amp; emergency safety in BD.
  </text>
  <text x="90" y="352" font-family="'Inter', system-ui, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
    Instant link generation • End-to-end privacy • 1-Click revoke control.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(90, 420)">
    <rect x="0" y="0" width="180" height="46" rx="12" fill="#1e293b" stroke="#334155" />
    <text x="24" y="29" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">🛡️ 100% Consent</text>

    <rect x="195" y="0" width="180" height="46" rx="12" fill="#1e293b" stroke="#334155" />
    <text x="220" y="29" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">⏱️ Custom Expiry</text>

    <rect x="390" y="0" width="185" height="46" rx="12" fill="#1e293b" stroke="#334155" />
    <text x="412" y="29" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="600" fill="#e2e8f0">🚨 Emergency SOS</text>
  </g>

  <!-- Official Domain URL Footer -->
  <text x="90" y="540" font-family="'Inter', system-ui, sans-serif" font-size="22" font-weight="700" fill="#38bdf8">
    bdla.vercel.app
  </text>
  <text x="270" y="540" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="400" fill="#64748b">
    | Powered by Supabase &amp; OpenStreetMap
  </text>

  <!-- Right Visual Map Card -->
  <g transform="translate(810, 160)" filter="url(#cardShadow)">
    <rect width="280" height="300" rx="24" fill="#0f172a" stroke="#0ea5e9" stroke-width="2" />
    
    <!-- Radar Grid in Mini Card -->
    <circle cx="140" cy="140" r="110" stroke="#0284c7" stroke-opacity="0.3" stroke-width="1.5" fill="none" />
    <circle cx="140" cy="140" r="70" stroke="#0284c7" stroke-opacity="0.4" stroke-width="1.5" fill="none" />
    <circle cx="140" cy="140" r="30" stroke="#0284c7" stroke-opacity="0.5" stroke-width="1.5" fill="none" />
    
    <!-- Pulsing Location Pin -->
    <circle cx="140" cy="140" r="42" fill="#38bdf8" fill-opacity="0.2" />
    <circle cx="140" cy="140" r="16" fill="#0284c7" />
    <circle cx="140" cy="140" r="7" fill="#ffffff" />
    
    <!-- Bottom Status in Card -->
    <rect x="25" y="235" width="230" height="40" rx="8" fill="#1e293b" />
    <circle cx="45" cy="255" r="5" fill="#10b981" />
    <text x="60" y="261" font-family="'Inter', system-ui, sans-serif" font-size="13" font-weight="600" fill="#f8fafc">Live GPS: Dhaka, BD</text>
  </g>
</svg>
